<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1117">

<title>BlockForge</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0b1117;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at top,#183b2a,#0b1117 60%);
}

.auth-card{
  width:100%;
  max-width:420px;
  padding:30px 22px;
  background:#141d25;
  border:1px solid #263743;
  border-radius:25px;
  box-shadow:0 20px 60px #0008;
}

.logo{
  text-align:center;
  font-size:45px;
}

.brand{
  text-align:center;
  font-size:32px;
  font-weight:900;
}

.tagline{
  text-align:center;
  color:#91a0ab;
  margin:8px 0 25px;
}

.input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border:1px solid #30414e;
  border-radius:13px;
  background:#0e171e;
  color:white;
  outline:none;
}

.input:focus{
  border-color:#45d477;
}

.auth-btn{
  width:100%;
  padding:15px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  color:white;
  font-weight:bold;
}

.primary{
  background:#32c968;
}

.secondary{
  background:#246cff;
}

.guest{
  background:#293742;
}

#authMessage{
  text-align:center;
  min-height:20px;
  margin-top:15px;
  color:#ffd166;
  font-size:14px;
}

#app{
  display:none;
  min-height:100vh;
  padding-bottom:75px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#0b1117ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #1e2a33;
}

.top-brand{
  font-size:22px;
  font-weight:900;
}

.top-brand span{
  color:#45d477;
}

.profile-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#1d2a34;
  color:white;
  font-size:18px;
}

.content{
  max-width:950px;
  margin:auto;
  padding:18px 15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  padding:23px;
  border-radius:22px;
  background:linear-gradient(135deg,#183e29,#12251e 55%,#17232b);
  border:1px solid #27583a;
}

.hero h1{
  margin:0 0 8px;
  font-size:28px;
}

.hero p{
  color:#b7c6bd;
  line-height:1.5;
}

.hero button{
  background:#45d477;
  border:0;
  padding:12px 18px;
  border-radius:12px;
  font-weight:900;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 3px 13px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  padding:11px 16px;
  border-radius:20px;
  border:1px solid #2b3943;
  background:#151f27;
  color:#dce4e8;
}

.category.active{
  background:#45d477;
  color:#07120b;
  border-color:#45d477;
  font-weight:bold;
}

.search-box{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.search-box input{
  flex:1;
  margin:0;
}

.mods-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.mod-card{
  background:#151e26;
  border:1px solid #26343e;
  border-radius:17px;
  overflow:hidden;
}

.mod-image{
  height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  background:linear-gradient(135deg,#263f32,#19252d);
}

.mod-info{
  padding:12px;
}

.mod-name{
  font-weight:bold;
  margin-bottom:5px;
  word-break:break-word;
}

.mod-meta{
  color:#84939e;
  font-size:12px;
  margin-bottom:10px;
}

.download-btn{
  width:100%;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#263640;
  color:white;
  font-weight:bold;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:#788792;
  padding:35px 10px;
}

.form-card,
.profile-card{
  background:#151e26;
  border:1px solid #26343e;
  border-radius:18px;
  padding:18px;
}

label{
  display:block;
  margin:12px 0 7px;
  color:#b7c3ca;
  font-size:14px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

select{
  width:100%;
  padding:14px;
  border:1px solid #30414e;
  border-radius:13px;
  background:#0e171e;
  color:white;
}

.file-input{
  width:100%;
  padding:14px;
  border:1px dashed #425461;
  border-radius:13px;
  background:#0e171e;
  color:#b8c5cc;
}

.file-name{
  margin-top:8px;
  color:#45d477;
  font-size:13px;
  word-break:break-all;
}

.submit-upload{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#45d477;
  color:#07120b;
  font-weight:900;
}

#uploadMessage{
  text-align:center;
  margin-top:15px;
  color:#ffd166;
}

.avatar{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#263640;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.profile-card{
  text-align:center;
}

.logout-btn{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#c93434;
  color:white;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#111920f5;
  backdrop-filter:blur(15px);
  border-top:1px solid #26343e;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#75838d;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
}

.nav-icon{
  font-size:21px;
}

.nav-btn.active{
  color:#45d477;
}

@media(min-width:700px){
  .mods-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<section id="auth">

<div class="auth-card">

<div class="logo">⚒️</div>

<div class="brand">BlockForge</div>

<div class="tagline">
Mods • Texture Packs • Maps • Add-ons
</div>

<input
id="email"
class="input"
type="email"
placeholder="Correo electrónico"
>

<input
id="password"
class="input"
type="password"
placeholder="Contraseña"
>

<button class="auth-btn primary" onclick="login()">
Iniciar sesión
</button>

<button class="auth-btn secondary" onclick="register()">
Crear cuenta
</button>

<button class="auth-btn guest" onclick="continueAsGuest()">
Continuar sin cuenta
</button>

<div id="authMessage"></div>

</div>

</section>


<section id="app">

<header class="topbar">

<div class="top-brand">
⚒️ Block<span>Forge</span>
</div>

<button class="profile-btn" onclick="showPage('profile')">
👤
</button>

</header>


<main class="content">


<div id="homePage" class="page active">

<div class="hero">

<h1>Bienvenido a BlockForge ⚒️</h1>

<p>
Descubre mods, texture packs, mapas y add-ons
creados por la comunidad.
</p>

<button onclick="showPage('upload')">
📤 Subir contenido
</button>

</div>


<div class="search-box">

<input
id="searchInput"
class="input"
placeholder="🔎 Buscar mods..."
oninput="loadMods()"
>

</div>


<div class="section-title">
<h2>Categorías</h2>
</div>


<div class="categories">

<button class="category active"
onclick="selectCategory('all',this)">
🔥 Todo
</button>

<button class="category"
onclick="selectCategory('mods',this)">
⚔️ Mods
</button>

<button class="category"
onclick="selectCategory('textures',this)">
🎨 Texturas
</button>

<button class="category"
onclick="selectCategory('maps',this)">
🌎 Mapas
</button>

<button class="category"
onclick="selectCategory('addons',this)">
🧩 Add-ons
</button>

</div>


<div class="section-title">
<h2>🔥 BlockForge</h2>
<span id="resultCount"></span>
</div>


<div id="modsGrid" class="mods-grid">

<div class="empty">
⏳ Cargando mods...
</div>

</div>

</div>


<div id="uploadPage" class="page">

<div class="section-title">
<h2>📤 Subir contenido</h2>
</div>

<div class="form-card">

<label>Nombre</label>

<input
id="modName"
class="input"
placeholder="Ej. Ultra Texture Pack"
>


<label>Descripción</label>

<textarea
id="modDescription"
class="input"
placeholder="Describe tu contenido..."
></textarea>


<label>Categoría</label>

<select id="modCategory">

<option value="mods">⚔️ Mod</option>
<option value="textures">🎨 Texture Pack</option>
<option value="maps">🌎 Mapa</option>
<option value="addons">🧩 Add-on</option>

</select>


<label>Archivo</label>

<input
id="modFile"
class="file-input"
type="file"
accept="*/*"
onchange="showSelectedFile()"
>

<div id="selectedFile" class="file-name"></div>


<button
class="submit-upload"
onclick="uploadMod()"
>
🚀 Subir a BlockForge
</button>

<div id="uploadMessage"></div>

</div>

</div>


<div id="profilePage" class="page">

<div class="section-title">
<h2>👤 Mi perfil</h2>
</div>

<div class="profile-card">

<div class="avatar">👤</div>

<h2 id="profileEmail">Usuario</h2>

<p>Miembro de BlockForge</p>

<button class="logout-btn" onclick="logout()">
Cerrar sesión
</button>

</div>

</div>


</main>


<nav class="bottom-nav">

<button
class="nav-btn active"
onclick="showPage('home')"
>
<span class="nav-icon">🏠</span>
Inicio
</button>

<button
class="nav-btn"
onclick="focusSearch()"
>
<span class="nav-icon">🔍</span>
Buscar
</button>

<button
id="navUpload"
class="nav-btn"
onclick="showPage('upload')"
>
<span class="nav-icon">➕</span>
Subir
</button>

<button
class="nav-btn"
onclick="showPage('profile')"
>
<span class="nav-icon">👤</span>
Perfil
</button>

</nav>

</section>


<script>

const SUPABASE_URL =
"https://xdvgyhrzohhmzvalytyb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_koqa0H7taiCafaQovJSl-A_h2SsVmWy";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let selectedCategory="all";


function authMessage(text){

document.getElementById("authMessage")
.textContent=text;

}


async function register(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!email||!password){

authMessage("Escribe correo y contraseña.");

return;

}

if(password.length<6){

authMessage(
"La contraseña necesita mínimo 6 caracteres."
);

return;

}

authMessage("Creando cuenta...");

const {data,error}=
await supabaseClient.auth.signUp({

email,
password

});

if(error){

authMessage("❌ "+error.message);

return;

}

if(data.session){

currentUser=data.user;

openApp();

}else{

authMessage(
"✅ Cuenta creada. Revisa tu correo."
);

}

}


async function login(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!email||!password){

authMessage("Escribe correo y contraseña.");

return;

}

authMessage("Iniciando sesión...");

const {data,error}=
await supabaseClient.auth.signInWithPassword({

email,
password

});

if(error){

authMessage("❌ "+error.message);

return;

}

currentUser=data.user;

openApp();

}


function continueAsGuest(){

currentUser=null;

openApp();

document.getElementById("navUpload")
.style.display="none";

}


function openApp(){

document.getElementById("auth")
.style.display="none";

document.getElementById("app")
.style.display="block";

if(currentUser){

document.getElementById("profileEmail")
.textContent=currentUser.email;

document.getElementById("navUpload")
.style.display="flex";

}else{

document.getElementById("profileEmail")
.textContent="Invitado";

document.getElementById("navUpload")
.style.display="none";

}

loadMods();

}


function showPage(page){

document.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});

if(page==="home"){

document.getElementById("homePage")
.classList.add("active");

}

if(page==="upload"){

if(!currentUser){

alert(
"🔒 Necesitas una cuenta para subir contenido."
);

return;

}

document.getElementById("uploadPage")
.classList.add("active");

}

if(page==="profile"){

document.getElementById("profilePage")
.classList.add("active");

}

}


function focusSearch(){

showPage("home");

setTimeout(()=>{

const input=
document.getElementById("searchInput");

input.focus();

input.scrollIntoView({
behavior:"smooth",
block:"center"
});

},100);

}


function selectCategory(category,button){

selectedCategory=category;

document
.querySelectorAll(".category")
.forEach(b=>{
b.classList.remove("active");
});

button.classList.add("active");

loadMods();

}


async function loadMods(){

const grid=
document.getElementById("modsGrid");

grid.innerHTML=
'<div class="empty">⏳ Cargando...</div>';

let query=
supabaseClient
.from("mods")
.select("*")
.eq("status","approved")
.order("created_at",{ascending:false});

if(selectedCategory!=="all"){

query=query.eq(
"category",
selectedCategory
);

}

const search=
document.getElementById("searchInput")
.value.trim();

if(search){

query=query.ilike(
"name",
"%"+search+"%"
);

}

const {data,error}=await query;

if(error){

console.error(error);

grid.innerHTML=
'<div class="empty">❌ Error cargando contenido.</div>';

return;

}

if(!data||data.length===0){

grid.innerHTML=
'<div class="empty">No hay contenido disponible todavía.</div>';

document.getElementById("resultCount")
.textContent="0 resultados";

return;

}

document.getElementById("resultCount")
.textContent=
data.length+
(data.length===1?" resultado":" resultados");

grid.innerHTML="";

data.forEach(mod=>{

const card=
document.createElement("article");

card.className="mod-card";

let icon="⚒️";

if(mod.category==="textures")
icon="🎨";

if(mod.category==="maps")
icon="🌎";

if(mod.category==="addons")
icon="🧩";

card.innerHTML=`

<div class="mod-image">
${icon}
</div>

<div class="mod-info">

<div class="mod-name">
${escapeHTML(mod.name)}
</div>

<div class="mod-meta">
${categoryName(mod.category)}
<br>
📥 ${mod.downloads||0} descargas
</div>

<button
class="download-btn"
onclick="downloadMod('${mod.id}')"
>
⬇️ Descargar
</button>

</div>

`;

grid.appendChild(card);

});

}


function categoryName(category){

const names={
mods:"⚔️ Mod",
textures:"🎨 Texture Pack",
maps:"🌎 Mapa",
addons:"🧩 Add-on"
};

return names[category]||"Contenido";

}


function escapeHTML(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* Mostrar archivo seleccionado */

function showSelectedFile(){

const input=
document.getElementById("modFile");

const output=
document.getElementById("selectedFile");

if(!input.files.length){

output.textContent="";

return;

}

const file=input.files[0];

const sizeMB=
(file.size/(1024*1024))
.toFixed(2);

output.textContent=
"📦 "+file.name+
" • "+sizeMB+" MB";

}


/* Subida */

async function uploadMod(){

if(!currentUser){

alert(
"🔒 Inicia sesión para subir contenido."
);

return;

}

const message=
document.getElementById("uploadMessage");

const name=
document.getElementById("modName")
.value.trim();

const description=
document.getElementById("modDescription")
.value.trim();

const category=
document.getElementById("modCategory")
.value;

const file=
document.getElementById("modFile")
.files[0];

if(!name){

message.textContent=
"❌ Escribe un nombre.";

return;

}

if(!file){

message.textContent=
"❌ Selecciona un archivo.";

return;

}


/* Comprobación del tipo */

const allowed=[
"mcpack",
"mcaddon",
"mcworld",
"zip"
];

const extension=
file.name
.split(".")
.pop()
.toLowerCase();

if(!allowed.includes(extension)){

message.textContent=
"❌ Solo se permiten .mcpack, .mcaddon, .mcworld y .zip.";

return;

}


/* Límite de 200 MB */

if(file.size>
200*1024*1024){

message.textContent=
"❌ El archivo supera los 200 MB.";

return;

}


message.textContent=
"⏳ Subiendo archivo...";


const safeName=
file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const filePath=
currentUser.id+
"/"+
Date.now()+
"_"+safeName;


/* Storage */

const {error:storageError}=
await supabaseClient
.storage
.from("minecraft-files")
.upload(
filePath,
file,
{
upsert:false,
contentType:
file.type||
"application/octet-stream"
}
);

if(storageError){

console.error(storageError);

message.textContent=
"❌ Error al subir: "+
storageError.message;

return;

}


/* Base de datos */

const {error:dbError}=
await supabaseClient
.from("mods")
.insert({

user_id:currentUser.id,
name:name,
description:description,
file_path:filePath,
file_type:extension,
category:category,
status:"pending",
downloads:0

});

if(dbError){

console.error(dbError);

await supabaseClient
.storage
.from("minecraft-files")
.remove([filePath]);

message.textContent=
"❌ No se pudo registrar el archivo.";

return;

}


message.textContent=
"🟡 ¡Subido! Quedó pendiente de revisión.";

document.getElementById("modName")
.value="";

document.getElementById("modDescription")
.value="";

document.getElementById("modFile")
.value="";

document.getElementById("selectedFile")
.textContent="";

}


async function downloadMod(id){

const {data,error}=
await supabaseClient
.from("mods")
.select("*")
.eq("id",id)
.eq("status","approved")
.single();

if(error||!data){

alert(
"❌ Este archivo no está disponible."
);

return;

}

const {data:urlData}=
supabaseClient
.storage
.from("minecraft-files")
.getPublicUrl(
data.file_path
);

if(!urlData||!urlData.publicUrl){

alert(
"❌ No se pudo obtener el archivo."
);

return;

}

await supabaseClient
.from("mods")
.update({
downloads:(data.downloads||0)+1
})
.eq("id",id);

window.open(
urlData.publicUrl,
"_blank"
);

}


async function logout(){

await supabaseClient
.auth
.signOut();

location.reload();

}


async function checkSession(){

const {data}=
await supabaseClient
.auth
.getSession();

if(data.session){

currentUser=
data.session.user;

openApp();

}

}


checkSession();

</script>

</body>
</html>
